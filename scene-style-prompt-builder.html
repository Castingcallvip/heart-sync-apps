<title>Scene & Style Prompt Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B0B10; --surface:#151319; --surface-2:#1B1820; --chip:#232030; --line:#2A2732; --line-soft:#211E27;
  --pink:#FF2E7E; --pink-soft:rgba(255,46,126,.14); --pink-dim:rgba(255,46,126,.35);
  --text:#F2F1F6; --text-dim:#9C98A8; --text-faint:#6B6778;
  --radius:16px; --font-d:'Space Grotesk',sans-serif; --font-b:'Inter',sans-serif; --font-m:'IBM Plex Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{background:var(--bg);color:var(--text);font-family:var(--font-b);-webkit-font-smoothing:antialiased;}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(900px 500px at 90% -10%, rgba(255,46,126,.12), transparent 60%),
             radial-gradient(800px 460px at -10% 110%, rgba(139,92,246,.10), transparent 60%);}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
input{font-family:inherit;}
::-webkit-scrollbar{width:8px;} ::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px;}

.shell{position:relative;z-index:1;max-width:640px;margin:0 auto;padding:26px 20px 110px;min-height:100vh;display:flex;flex-direction:column;}
.topline{font-family:var(--font-m);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-faint);margin-bottom:14px;}

/* progress */
.progress-track{height:5px;background:var(--surface-2);border-radius:100px;overflow:hidden;margin-bottom:22px;}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--violet,#8B5CF6),var(--pink));border-radius:100px;transition:width .35s ease;}
.progress-label{display:flex;justify-content:space-between;font-family:var(--font-m);font-size:10.5px;color:var(--text-faint);margin-bottom:6px;}

/* step header */
.step-eyebrow{font-family:var(--font-m);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--pink);margin-bottom:8px;}
.step-title{font-family:var(--font-d);font-weight:700;font-size:21px;margin-bottom:6px;line-height:1.25;}
.step-sub{color:var(--text-dim);font-size:13px;margin-bottom:18px;line-height:1.5;}

/* search box for big lists */
.search-box{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);
  border-radius:10px;padding:10px 14px;margin-bottom:14px;}
.search-box input{flex:1;background:none;border:none;outline:none;color:var(--text);font-size:13px;}
.search-box input::placeholder{color:var(--text-faint);}
.search-box .ico{color:var(--text-faint);font-size:13px;}

.body-scroll{flex:1;overflow-y:auto;padding-bottom:8px;}

.chip-grid{display:flex;flex-wrap:wrap;gap:9px;}
.chip{padding:10px 16px;border-radius:10px;background:var(--chip);border:1px solid var(--line);
  font-size:13px;font-weight:500;color:var(--text-dim);white-space:nowrap;transition:all .16s ease;}
.chip:hover{border-color:var(--pink-dim);color:var(--text);}
.chip.active{background:var(--pink);border-color:var(--pink);color:#fff;font-weight:600;
  box-shadow:0 6px 14px -8px rgba(255,46,126,.55);}

.show-more{font-family:var(--font-m);font-size:11.5px;color:var(--text-dim);border:1px dashed var(--line);
  padding:9px 15px;border-radius:10px;margin-top:2px;}
.show-more:hover{color:var(--text);border-color:var(--pink-dim);}

.no-results{color:var(--text-faint);font-size:12.5px;font-style:italic;padding:10px 2px;}

.skip-note{font-family:var(--font-m);font-size:11px;color:var(--text-faint);margin-top:16px;}
.skip-note button{color:var(--pink);text-decoration:underline;}

/* nav bar */
.nav-bar{position:sticky;bottom:0;background:linear-gradient(0deg, var(--bg) 60%, transparent);
  padding-top:18px;margin-top:auto;display:flex;gap:10px;}
.nav-btn{flex:1;padding:14px;border-radius:12px;text-align:center;font-weight:700;font-size:14px;transition:all .2s;}
.nav-back{background:var(--surface-2);border:1px solid var(--line);color:var(--text-dim);flex:0 0 90px;}
.nav-back:hover{color:var(--text);border-color:var(--text-dim);}
.nav-next{background:linear-gradient(90deg, var(--pink), #B0389A);color:#fff;
  box-shadow:0 12px 26px -14px rgba(255,46,126,.6);}
.nav-next:hover{filter:brightness(1.08);}
.nav-next .cnt{font-family:var(--font-m);font-weight:400;font-size:11px;opacity:.85;margin-left:4px;}

/* review screen */
.review-group{margin-bottom:16px;}
.review-group h4{font-family:var(--font-m);font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--pink);margin-bottom:8px;}
.review-chips{display:flex;flex-wrap:wrap;gap:7px;}
.review-chip{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:5px 11px;font-size:11.5px;color:var(--text-dim);}
.jump-btn{font-family:var(--font-m);font-size:10px;color:var(--text-faint);margin-left:6px;}
.jump-btn:hover{color:var(--pink);}

.result-panel{margin-top:16px;background:#0D0C11;border:1px solid var(--line);border-radius:14px;padding:18px 20px;display:none;}
.result-panel.show{display:block;}
.result-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.result-head h4{font-family:var(--font-m);font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--text-dim);}
.copy-btn{font-family:var(--font-m);font-size:11px;padding:6px 12px;border-radius:8px;border:1px solid var(--line);color:var(--text-dim);}
.copy-btn:hover{color:var(--text);border-color:var(--pink);}
.copy-btn.copied{color:var(--pink);border-color:var(--pink);}
.result-text{font-family:var(--font-m);font-size:12.5px;line-height:1.75;color:#F3C9E0;white-space:pre-wrap;cursor:text;user-select:text;max-height:340px;overflow-y:auto;}

.mode-grid{display:flex;flex-wrap:wrap;gap:10px;}
.mode-chip{padding:14px 20px;border-radius:12px;background:var(--surface);border:1px solid var(--line);
  font-size:14px;font-weight:600;color:var(--text-dim);transition:all .18s;}
.mode-chip:hover{border-color:var(--pink-dim);}
.mode-chip.active{background:var(--pink);border-color:var(--pink);color:#fff;box-shadow:0 6px 16px -8px rgba(255,46,126,.6);}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(16px);
  background:var(--surface-2);border:1px solid var(--line);padding:11px 18px;border-radius:10px;
  font-size:12.5px;font-family:var(--font-m);opacity:0;pointer-events:none;transition:all .3s;z-index:60;
  display:flex;align-items:center;gap:8px;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.toast .dot{width:6px;height:6px;border-radius:50%;background:var(--pink);box-shadow:0 0 6px var(--pink);}
</style>
</head>

// selections: for CATEGORIES, key = "CategoryTitle::Item" -> true

let mode = null;

// Steps: 0 = mode picker, 1..N = one per category, N+1 = review/generate
const TOTAL_STEPS = CATEGORIES.length + 2;
let step = 0;
const QUICK_PICK_COUNT = 12;
const expandedCats = {}; // categoryIndex -> true once "show all" clicked
const searchTerms = {}; // categoryIndex -> current search string

function key(cat, item){ return cat + "::" + item; }

function catIndexForStep(s){ return s - 1; } // step 1 => CATEGORIES[0]

function render(){
  updateProgress();
  document.getElementById("backBtn").style.visibility = step === 0 ? "hidden" : "visible";
  const body = document.getElementById("stepBody");

  if(step === 0){
    renderModeStep(body);
  } else if(step <= CATEGORIES.length){
    renderCategoryStep(body, CATEGORIES[catIndexForStep(step)], catIndexForStep(step));
  } else {
    renderReviewStep(body);
  }
}

function updateProgress(){
  const pct = Math.round((step / (TOTAL_STEPS - 1)) * 100);
  document.getElementById("progressFill").style.width = pct + "%";
  document.getElementById("stepPct").textContent = pct + "%";
  document.getElementById("stepLabel").textContent = step === TOTAL_STEPS - 1
    ? "Review & generate"
    : `Step ${step + 1} of ${TOTAL_STEPS}`;
}

function renderModeStep(body){
  body.innerHTML = `
    <div class="step-eyebrow">Getting started</div>
    <div class="step-title">Who's in the shot?</div>
    <div class="step-sub">This sets the mode for the whole scene before we get into styling details.</div>
    <div class="mode-grid" id="modeGrid"></div>
  `;
  const grid = document.getElementById("modeGrid");
  MODES.forEach(m => {
    const b = document.createElement("button");
    b.className = "mode-chip" + (m === mode ? " active" : "");
    b.textContent = m;
    b.onclick = () => { mode = m; render(); };
    grid.appendChild(b);
  });
  document.getElementById("nextCount").textContent = "";
}

function renderCategoryStep(body, cat, ci){
  const count = cat.items.filter(i => selected[key(cat.title,i)]).length;
  const isBig = cat.items.length > QUICK_PICK_COUNT;
  const term = (searchTerms[ci] || "").toLowerCase();

  let pool = cat.items;
  if(isBig && term){
    pool = cat.items.filter(i => i.toLowerCase().includes(term));
  } else if(isBig && !expandedCats[ci]){
    // show quick picks: selected items first, then fill up to QUICK_PICK_COUNT
    const picked = cat.items.filter(i => selected[key(cat.title,i)]);
    const rest = cat.items.filter(i => !selected[key(cat.title,i)]);
    pool = picked.concat(rest).slice(0, Math.max(QUICK_PICK_COUNT, picked.length));
  }

  body.innerHTML = `
    <div class="step-eyebrow">${cat.title}</div>
    <div class="step-title">${questionFor(cat.title)}</div>
    <div class="step-sub">Tap any that fit — you can pick more than one, or skip entirely.</div>
    ${isBig ? `<div class="search-box"><span class="ico">⌕</span><input type="text" id="searchInput" placeholder="Search ${cat.items.length} options..." value="${term.replace(/"/g,'')}"></div>` : ''}
    <div class="chip-grid" id="chipGrid"></div>
    ${isBig && !term ? `<button class="show-more" id="showMoreBtn" style="margin-top:12px;">${expandedCats[ci] ? '− Show fewer' : `+ Show all ${cat.items.length}`}</button>` : ''}
    <div class="skip-note">${count ? '' : `Nothing picked yet — that's fine, <button onclick="goNext()">skip this one</button>.`}</div>
  `;

  const grid = document.getElementById("chipGrid");
  if(pool.length === 0){
    grid.innerHTML = `<div class="no-results">No matches for "${term}"</div>`;
  } else {
    pool.forEach(i => {
      const b = document.createElement("button");
      const active = !!selected[key(cat.title,i)];
      b.className = "chip" + (active ? " active" : "");
      b.textContent = (cat.plus ? "+ " : "") + i;
      b.onclick = () => {
        selected[key(cat.title,i)] = !selected[key(cat.title,i)];
        render();
      };
      grid.appendChild(b);
    });
  }

  if(isBig){
    const input = document.getElementById("searchInput");
    if(input){
      input.oninput = (e) => { searchTerms[ci] = e.target.value; render(); document.getElementById("searchInput").focus(); document.getElementById("searchInput").setSelectionRange(searchTerms[ci].length, searchTerms[ci].length); };
    }
    const moreBtn = document.getElementById("showMoreBtn");
    if(moreBtn) moreBtn.onclick = () => { expandedCats[ci] = !expandedCats[ci]; render(); };
  }

  document.getElementById("nextCount").textContent = count ? `(${count} picked)` : "";
}

// friendlier phrasing per category, falls back to a generic question
const QUESTION_MAP = {
  "Everyday & Street Luxury": "Any everyday street-luxury looks?",
  "Y2K & Baddie Fits": "Feeling any Y2K or baddie fits?",
  "Luxury & Red-Carpet Couture": "Want any red-carpet couture moments?",
  "Boss Babe Affirmations": "Add a boss-babe affirmation overlay?",
  "Lifestyle & Vibe": "What lifestyle flexes fit the scene?",
  "Big Brand Hauls": "Any brand-haul references?",
  "Shot Type & Storyboard": "What shot type works here?",
  "Scene & Lighting": "Where's this scene set?",
  "Body Type": "Any body type notes for this render?",
  "Designer Aesthetics": "Channeling any designer houses?",
  "Materials & Motifs": "Any fabrics or materials to call out?",
  "Editorial Finish": "What finish should the shot have?",
  "Accessories": "Any accessories to add?",
  "Jewelry": "Any jewelry pieces?",
  "Skin Tone": "What skin tone?",
  "Skin Undertone": "Any specific undertone?",
  "Skin Realism Features": "Want any realism texture details?",
  "Makeup Look": "What makeup look?",
  "Detailed Lash Styles": "Any specific lash style?",
  "Hair Style": "Quick-pick a hair style?",
  "Detailed Hair Styles": "Want a more specific hair style?",
  "Baddie & Classy Hairstyles": "Any baddie or classy hairstyle finishes?",
};
function questionFor(title){ return QUESTION_MAP[title] || `Anything from ${title}?`; }

function renderReviewStep(body){
  let html = `
    <div class="step-eyebrow">Almost there</div>
    <div class="step-title">Review your picks</div>
    <div class="step-sub">Mode: <b style="color:var(--text)">${mode || '—'}</b></div>
  `;
  CATEGORIES.forEach((cat, ci) => {
    const picks = cat.items.filter(i => selected[key(cat.title,i)]);
    if(picks.length){
      html += `<div class="review-group">
        <h4>${cat.title} <button class="jump-btn" onclick="jumpTo(${ci+1})">edit</button></h4>
        <div class="review-chips">${picks.map(p=>`<span class="review-chip">${p}</span>`).join('')}</div>
      </div>`;
    }
  });
  const anyPicks = Object.values(selected).some(Boolean);
  if(!anyPicks){
    html += `<div class="skip-note" style="margin-top:0;">Nothing selected yet — go back and tap a few chips, or generate anyway for a blank template.</div>`;
  }
  html += `
    <button class="nav-btn nav-next" style="width:100%;margin-top:10px;" onclick="generatePrompt()">✨ Generate Prompt</button>
    <div class="result-panel" id="resultPanel">
      <div class="result-head"><h4>Assembled prompt</h4><button class="copy-btn" id="copyBtn" onclick="copyResult()">Copy</button></div>
      <div class="result-text" id="resultText" onclick="selectResultText()"></div>
    </div>
  `;
  body.innerHTML = html;
  document.getElementById("nextBtn").style.visibility = "hidden";
}

function jumpTo(s){ step = s; document.getElementById("nextBtn").style.visibility = "visible"; render(); }

function goNext(){
  if(step < TOTAL_STEPS - 1){ step++; render(); }
}
function goBack(){
  if(step > 0){ step--; document.getElementById("nextBtn").style.visibility = "visible"; render(); }
}

function generatePrompt(){
  let lines = [`MODE: ${mode || '[not selected]'}`, ""];
  CATEGORIES.forEach(cat => {
    const picks = cat.items.filter(i => selected[key(cat.title, i)]);
    if(picks.length) lines.push(`${cat.title}: ${picks.join(", ")}`);
  });
  if(lines.length === 2) lines.push("[No selections made — tap chips in each step to build the scene]");
  lines.push("", "Note: apply on top of this character's locked CORE DNA (face, eyes, body) — styling and scene only.");
  document.getElementById("resultText").textContent = lines.join("\n");
  document.getElementById("resultPanel").classList.add("show");
  showToast("Prompt generated");
}

/* ---------- clipboard (with fallback) ---------- */
function copyToClipboard(text){
  return new Promise((resolve, reject) => {
    if(navigator.clipboard && navigator.clipboard.writeText && window.isSecureContext){
      navigator.clipboard.writeText(text).then(resolve).catch(() => fallbackCopy(text) ? resolve() : reject());
    } else {
      fallbackCopy(text) ? resolve() : reject();
    }
  });
}
function fallbackCopy(text){
  try{
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed"; ta.style.top = "-9999px"; ta.style.left = "-9999px";
    document.body.appendChild(ta);
    ta.focus(); ta.select();
    const ok = document.execCommand("copy");
    document.body.removeChild(ta);
    return ok;
  }catch(e){ return false; }
}
function selectResultText(){
  const el = document.getElementById("resultText");
  const range = document.createRange();
  range.selectNodeContents(el);
  const sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(range);
}
function copyResult(){
  const text = document.getElementById("resultText").textContent;
  const btn = document.getElementById("copyBtn");
  copyToClipboard(text).then(() => {
    const orig = btn.textContent;
    btn.textContent = "✓ Copied";
    btn.classList.add("copied");
    setTimeout(()=>{ btn.textContent = orig; btn.classList.remove("copied"); }, 1600);
    showToast("Copied to clipboard");
  }).catch(() => {
    selectResultText();
    showToast("Auto-copy blocked here — text is selected, press Ctrl/Cmd+C");
  });
}

let toastTimer;
function showToast(msg){
  const t = document.getElementById("toast");
  document.getElementById("toastMsg").textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove("show"), 2400);
}

render();
</script>
